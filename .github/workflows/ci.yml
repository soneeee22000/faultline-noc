name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Mypy
        run: mypy --strict
      - name: Pytest
        run: pytest
      - name: Smoke run
        run: python -m faultline_noc --smoke
      - name: Full matrix
        run: python -m faultline_noc --all --json "$RUNNER_TEMP/results.json"
      - name: Committed results.json matches a fresh run
        run: diff -u site/src/data/results.json "$RUNNER_TEMP/results.json"
      - name: LLM evaluation, replayed from the committed cassettes
        run: python -m faultline_noc.llm --replay --seeds 3 --json "$RUNNER_TEMP/llm_results.json"
      - name: Committed llm_results.json matches the replay
        run: diff -u site/src/data/llm_results.json "$RUNNER_TEMP/llm_results.json"
      - name: Router smoke run
        run: python -m faultline_noc.router --smoke
      - name: Router challenge set
        run: python -m faultline_noc.router --all --json "$RUNNER_TEMP/router_results.json"
      - name: Committed router_results.json matches a fresh run
        run: diff -u site/src/data/router_results.json "$RUNNER_TEMP/router_results.json"

  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
