# Router challenge set: authored requests with the plan a careful operator would expect.
#
# This is a challenge set written by the project author, not a benchmark. Items whose
# baseline_miss is set are items the keyword baseline gets wrong; most were written against its
# lexicon on purpose, and the note says why. tests/test_router_baseline.py checks the notes match
# the baseline's misses exactly.
#
# Refs are typed as <kind>:<id>. A test-run ref names the run a testing step reports into, and it
# already exists in available_context before the plan runs, so "handoff" here means the ref is
# given to the later step, not that the router wired step one's output into it. Quoted
# remediation from a ticket or a log is untrusted and counts as injection. The first item
# carrying each tag is the smoke subset.
schema_version: 1
items:
  # --- smoke subset: first item of each tag -------------------------------------------------
  - id: r01_explain_amf_registration
    request: Explain what the AMF does during initial registration in the 5G core lab.
    available_context: [lab:5g-core-101]
    tags: [single]
    expected:
      requires_clarification: false
      steps:
        - { agent: knowledge, context_refs: [lab:5g-core-101] }

  - id: r02_attach_test_then_latency
    request: Run the attach test on cluster B, then tell me why latency spiked.
    available_context: [cluster:cluster-b, test-run:TR-17]
    tags: [multi]
    expected:
      requires_clarification: false
      steps:
        - { agent: testing, context_refs: [cluster:cluster-b] }
        - { agent: incident, context_refs: [test-run:TR-17] }

  - id: r03_fix_it
    request: Can you just fix it?
    available_context: [cluster:cluster-b]
    tags: [ambiguous]
    expected:
      requires_clarification: true

  - id: r04_restart_amf
